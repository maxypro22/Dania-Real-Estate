# Decap CMS configuration — the /dashboard content manager.
#
# Publishing model: edits are committed to this git repo on `branch` below;
# Vercel then rebuilds and the change goes live for all visitors.
#
# PHASE 2 (to make login + publish work), set `repo` to your GitHub repo and
# wire GitHub OAuth (see CMS_SETUP.md). Until then you can test locally:
#   1) npx decap-server         (in one terminal)
#   2) npm run dev              (in another)
#   3) open http://localhost:5173/dashboard/  (uses local_backend, no login)

backend:
  name: github
  repo: OWNER/REPO # TODO(Phase 2): set to "your-github-username/your-repo"
  branch: main
  commit_messages:
    create: 'cms: create {{collection}} “{{slug}}”'
    update: 'cms: update {{collection}} “{{slug}}”'
    delete: 'cms: delete {{collection}} “{{slug}}”'
    uploadMedia: 'cms: upload {{path}}'
    deleteMedia: 'cms: delete {{path}}'

# Lets you edit locally without GitHub during setup (via `npx decap-server`).
local_backend: true

media_folder: 'public/uploads'
public_folder: '/uploads'

collections:
  - name: 'settings'
    label: 'Site Settings'
    description: 'Logo, contact details, phone numbers, social links, hours.'
    editor:
      preview: false
    files:
      - name: 'company'
        label: 'Company & Contact'
        file: 'src/content/settings.json'
        fields:
          - label: 'Company'
            name: 'company'
            widget: 'object'
            fields:
              - { label: 'Name (English)', name: 'name', widget: 'string' }
              - { label: 'Name (Arabic)', name: 'nameAr', widget: 'string' }
              - { label: 'Tagline', name: 'tagline', widget: 'string' }
              - { label: 'Address', name: 'address', widget: 'text' }
              - { label: 'Mobile (display)', name: 'phone', widget: 'string', hint: 'Primary call + WhatsApp line, e.g. +974 3326 0393' }
              - { label: 'WhatsApp number (digits only)', name: 'whatsapp', widget: 'string', pattern: ['^[0-9]+$', 'Digits only, e.g. 97433260393'] }
              - { label: 'WhatsApp (display)', name: 'whatsappDisplay', widget: 'string' }
              - { label: 'Office landline', name: 'officePhone', widget: 'string', hint: 'Shown in the header top bar' }
              - { label: 'Email', name: 'email', widget: 'string' }
              - { label: 'Working hours', name: 'hours', widget: 'string' }
              - { label: 'Footer hours', name: 'footerHours', widget: 'string' }
              - { label: 'Facebook URL', name: 'facebook', widget: 'string' }
              - { label: 'Instagram URL', name: 'instagram', widget: 'string' }
              - { label: 'Founded year', name: 'founded', widget: 'string' }
              - { label: 'Stat — Properties', name: 'properties', widget: 'string' }
              - { label: 'Stat — Clients', name: 'clients', widget: 'string' }
              - { label: 'Stat — Experience', name: 'experience', widget: 'string' }
